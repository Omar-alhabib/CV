<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omar Alhabib — Senior Accountant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1628;
  --bg2:#0F1E36;
  --card:#13243F;
  --card2:#162949;
  --border:rgba(94,160,255,.18);
  --blue:#3B82F6;
  --blue2:#60A5FA;
  --sky:#BAD9FD;
  --text:#EBF2FF;
  --muted:#8BA8CC;
  --dim:#506480;
  --green:#34D399;
  --gold:#F4C558;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);line-height:1.75;font-size:15.5px;overflow-x:hidden}
.wrap{max-width:1040px;margin:0 auto;padding:0 28px}
a{color:inherit;text-decoration:none}

/* ── progress bar ── */
#bar{position:fixed;top:0;left:0;height:3px;width:0;z-index:100;background:linear-gradient(90deg,var(--blue),var(--sky))}

/* ── nav ── */
nav{position:fixed;top:3px;left:0;right:0;z-index:50;padding:13px 0;transition:background .3s}
nav.bg{background:rgba(11,22,40,.95);backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--border)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;max-width:1040px;margin:0 auto;padding:0 28px}
.nav-name{font-weight:800;font-size:16px;letter-spacing:.01em}
.lang-btn{
  font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;
  background:rgba(59,130,246,.12);border:1.5px solid rgba(59,130,246,.45);
  color:var(--blue2);padding:5px 18px;border-radius:99px;cursor:pointer;transition:.2s;
}
.lang-btn:hover{background:rgba(59,130,246,.25);color:#fff}

/* ── HERO ── */
.hero{
  min-height:100vh;display:flex;align-items:center;position:relative;
  padding:100px 0 70px;overflow:hidden;
  background:
    radial-gradient(ellipse 700px 500px at 90% 50%,rgba(59,130,246,.14),transparent 65%),
    radial-gradient(ellipse 500px 400px at 5% 20%,rgba(59,130,246,.08),transparent 60%),
    var(--bg);
}
/* subtle diagonal lines */
.hero::before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(
    -55deg,transparent,transparent 60px,rgba(59,130,246,.03) 60px,rgba(59,130,246,.03) 61px
  );pointer-events:none;
}
.hero-grid{display:grid;grid-template-columns:1fr 360px;gap:56px;align-items:center;position:relative;z-index:1}

/* photo */
.photo-wrap{position:relative;display:flex;justify-content:center}
.photo-wrap::before{
  content:"";position:absolute;inset:-1px;border-radius:20px;
  background:linear-gradient(145deg,rgba(59,130,246,.6),rgba(186,217,253,.2),transparent 60%);
  z-index:0;
}
.photo-wrap::after{
  content:"";position:absolute;inset:20px;border-radius:14px;
  box-shadow:0 0 80px rgba(59,130,246,.3);z-index:0;pointer-events:none;
}
.photo-wrap img{
  width:100%;aspect-ratio:1;object-fit:cover;object-position:top center;
  border-radius:18px;display:block;position:relative;z-index:1;
  box-shadow:0 30px 80px rgba(0,0,0,.55);
}

/* hero text */
.tag-line{
  display:inline-flex;align-items:center;gap:9px;
  font-size:12.5px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;
  color:var(--blue2);margin-bottom:14px;
}
.tag-line::before{content:"";width:28px;height:2px;background:var(--blue)}
h1{font-size:clamp(36px,5.5vw,58px);font-weight:900;line-height:1.12;margin-bottom:6px}
h1 span{color:var(--blue2)}
.title{font-size:clamp(16px,2.2vw,21px);font-weight:600;color:var(--muted);margin-bottom:22px}
.desc{color:#C2D5ED;font-size:15.5px;margin-bottom:28px;max-width:540px}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:36px}
.btn{
  display:inline-flex;align-items:center;gap:9px;
  font-family:'Cairo',sans-serif;font-weight:700;font-size:15px;
  padding:11px 24px;border-radius:8px;border:none;cursor:pointer;transition:.22s;
}
.btn svg{width:17px;height:17px;fill:currentColor;flex-shrink:0}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 8px 24px rgba(59,130,246,.35)}
.btn-primary:hover{background:#2563EB;transform:translateY(-2px)}
.btn-ghost{background:rgba(255,255,255,.05);border:1.5px solid var(--border);color:#D1E5FF}
.btn-ghost:hover{border-color:var(--blue2);background:rgba(59,130,246,.1)}
.phone-btn{direction:ltr}

/* quick facts strip */
.facts{display:flex;gap:0;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.fact{flex:1;padding:16px 14px;text-align:center;border-inline-end:1px solid var(--border);position:relative}
.fact:last-child{border-inline-end:none}
.fact .n{font-size:clamp(22px,3vw,30px);font-weight:900;color:var(--blue2);direction:ltr;line-height:1.2}
.fact .l{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}

/* ── section ── */
section{padding:56px 0 8px}
.sec-head{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.sec-head h2{font-size:20px;font-weight:800;color:var(--text)}
.sec-head .icon{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;
  background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.4);
  display:flex;align-items:center;justify-content:center;
}
.sec-head .icon svg{width:20px;height:20px;fill:var(--blue2)}
.sec-head::after{content:"";flex:1;height:1px;background:var(--border)}

/* ── experience cards ── */
.job{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:24px 28px;margin-bottom:18px;transition:.25s;position:relative;overflow:hidden;
}
.job::before{
  content:"";position:absolute;top:0;inset-inline-start:0;bottom:0;width:3.5px;
  background:var(--border);border-radius:0;transition:.25s;
}
.job.current::before{background:var(--blue);box-shadow:0 0 14px rgba(59,130,246,.5)}
.job:hover{border-color:rgba(59,130,246,.5);transform:translateY(-2px);box-shadow:0 14px 40px rgba(0,0,0,.35)}
.job-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.job h3{font-size:18px;font-weight:800}
.job .co{color:var(--blue2);font-size:14px;font-weight:700;margin-top:2px}
.now{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;color:var(--blue2);margin-top:6px}
.now .dot{width:7px;height:7px;border-radius:50%;background:var(--blue);animation:pulse 2s ease infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(59,130,246,.15)}}
.dates{
  font-size:12.5px;font-weight:700;color:var(--green);direction:ltr;white-space:nowrap;
  background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.3);
  padding:3px 14px;border-radius:99px;
}
.job ul{list-style:none}
.job li{
  padding-inline-start:20px;margin-bottom:6px;color:#BCCFE8;font-size:14.5px;
  position:relative;
}
.job li::before{
  content:"";position:absolute;inset-inline-start:4px;top:10px;
  width:7px;height:7px;border-radius:50%;background:rgba(59,130,246,.5);
}
.impact{
  margin-top:14px;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.35);
  border-inline-start:3.5px solid var(--blue);border-radius:8px;
  padding:12px 16px;font-size:14px;color:#D4E8FF;
  display:flex;gap:10px;align-items:flex-start;
}
.impact svg{width:17px;height:17px;fill:var(--blue2);flex-shrink:0;margin-top:4px}

/* cert attachment */
.attach{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cert-chip{
  display:inline-flex;align-items:center;gap:12px;cursor:pointer;
  background:var(--card2);border:1.5px solid var(--border);border-radius:10px;
  padding:8px 14px 8px 8px;font-family:'Cairo',sans-serif;transition:.22s;
}
.cert-chip:hover{border-color:var(--blue);box-shadow:0 6px 20px rgba(59,130,246,.2);transform:translateY(-1px)}
.cert-chip img{width:40px;height:52px;object-fit:cover;object-position:top;border-radius:4px;border:1px solid var(--border);display:block}
.cert-chip .ct{font-size:13px;font-weight:800;color:var(--text)}
.cert-chip .cs{font-size:11.5px;color:var(--blue2);font-weight:600;margin-top:2px}
.verified{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--green)}
.verified svg{width:16px;height:16px;fill:var(--green)}

/* ── bottom grid ── */
.btm{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}

/* certs */
.c-list{list-style:none}
.c-item{
  display:flex;align-items:center;gap:12px;padding:10px 0;
  border-bottom:1px solid var(--border);font-size:14.5px;font-weight:600;color:var(--text);
}
.c-item:last-child{border-bottom:none}
.c-ck{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  background:rgba(59,130,246,.12);border:1.5px solid var(--blue);
  display:flex;align-items:center;justify-content:center;color:var(--blue2);font-size:11px;font-weight:900;
}
.c-id{margin-inline-start:auto;font-size:11px;color:#000;background:var(--green);font-weight:800;border-radius:4px;padding:0 9px;direction:ltr;white-space:nowrap}

/* skills */
.skill-group{margin-bottom:18px}
.skill-group h4{font-size:12.5px;color:var(--dim);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:9px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:13px;font-weight:600;background:var(--card2);border:1px solid var(--border);color:#CFE0FA;padding:5px 15px;border-radius:6px;transition:.2s}
.tag:hover{border-color:var(--blue2)}
.tag.t{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.45);color:var(--blue2)}

/* education */
.edu{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:22px 26px;display:flex;align-items:center;gap:18px;
}
.edu .cap{width:46px;height:46px;border-radius:10px;flex-shrink:0;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.4);display:flex;align-items:center;justify-content:center}
.edu .cap svg{width:24px;height:24px;fill:var(--blue2)}
.edu h3{font-size:16px;font-weight:800}
.edu p{color:var(--muted);font-size:13.5px}
.edu .yr{margin-inline-start:auto;color:var(--green);font-weight:700;font-size:13px;direction:ltr;white-space:nowrap}

/* ── CTA ── */
.cta-band{
  margin-top:70px;padding:60px 0 70px;text-align:center;
  background:radial-gradient(ellipse 700px 300px at 50% 0%,rgba(59,130,246,.18),transparent 70%);
  border-top:1px solid var(--border);
}
.cta-band h2{font-size:clamp(22px,4vw,34px);font-weight:900;margin-bottom:8px}
.cta-band p{color:var(--muted);margin-bottom:26px;font-size:15px}
.cta-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

footer{padding:20px 0 32px;text-align:center;color:var(--dim);font-size:12.5px}

/* ── lightbox ── */
#lb{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:120;display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(6px)}
#lb.open{display:flex}
.lb-box{max-width:620px;width:100%;border-radius:12px;overflow:hidden;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.93);opacity:0}}
.lb-top{background:var(--card);padding:12px 18px;display:flex;align-items:center;gap:12px}
.lb-top .name{font-size:14px;font-weight:800;flex:1}
.lb-top .vfd{display:flex;align-items:center;gap:6px;color:var(--green);font-size:12.5px;font-weight:700}
.lb-top .vfd svg{width:15px;height:15px;fill:var(--green)}
.lb-close{background:rgba(255,255,255,.1);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px}
.lb-img{background:#fff;overflow:auto;max-height:82vh}
.lb-img img{width:100%;display:block}

/* ── reveal ── */
.reveal{opacity:0;transform:translateY(20px);transition:opacity .65s ease,transform .65s ease}
.reveal.show{opacity:1;transform:none}

@media(max-width:820px){
  .hero-grid{grid-template-columns:1fr;gap:32px}
  .hero-grid .photo-wrap{order:-1;max-width:240px;margin:0 auto}
  .hero-grid>div{text-align:center}
  .tag-line,.hero-btns,.facts,.now{justify-content:center}
  .desc{margin-inline:auto}
  .btm{grid-template-columns:1fr}
  .job-top{flex-direction:column;gap:6px}
}
@media(max-width:560px){.facts{flex-wrap:wrap}.fact{flex:0 0 50%;border-inline-end:none;border-bottom:1px solid var(--border)}.fact:nth-child(odd){border-inline-end:1px solid var(--border)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>

    {h:"الأنظمة والأدوات",tech:true,tags:["Deltek","Oracle","Odoo","SMACC","Excel (خبير)","Power BI"]},
    {h:"المهارات التحليلية",tags:["التقارير المالية","الميزانية والتنبؤ","التدقيق والامتثال","حساب الضرائب (VAT)","التفكير النقدي"]},
    {h:"المهارات الشخصية",tags:["سرعة التعلم","العمل ضمن فريق","حل المشكلات","الاهتمام بالتفاصيل"]}
  ]
}
};

let LANG='en';
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function toggleLang(){setLang(LANG==='en'?'ar':'en')}

let counted=false;
function runCounters(){
  if(counted)return;counted=true;
  document.querySelectorAll('.n[data-count]').forEach(el=>{
    const target=+el.dataset.count,suf=el.dataset.suffix||'';
    if(rm){el.textContent=target+suf;return}
    const dur=1200,t0=performance.now();
    (function step(t){
      const p=Math.min((t-t0)/dur,1);
      el.textContent=Math.round(target*(1-Math.pow(1-p,3)))+(p===1?suf:'');
      if(p<1)requestAnimationFrame(step);
    })(t0);
  });
}

let io;
function observe(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(!e.isIntersecting)return;
      e.target.classList.add('show');
      if(e.target.id==='facts')runCounters();
      io.unobserve(e.target);
    });
  },{threshold:.15});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
}

function setLang(l){
  LANG=l;
  const t=T[l];
  document.documentElement.lang=l;
  document.documentElement.dir=l==='ar'?'rtl':'ltr';
  document.getElementById('langBtn').textContent=l==='en'?'العربية':'English';
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t[el.dataset.i]);

  document.getElementById('jobs').innerHTML=t.jobs.map((j,i)=>`
    <article class="job reveal${j.current?' current':''}" style="transition-delay:${i*.07}s">
      <div class="job-top">
        <div>
          <h3>${esc(j.title)}</h3>
          <div class="co">${esc(j.co)}</div>
          ${j.current?`<div class="now"><span class="dot"></span><span>${esc(t.now_lbl)}</span></div>`:''}
        </div>
        <span class="dates">${esc(j.dates)}</span>
      </div>
      <ul>${j.pts.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
      ${j.hl?`<div class="impact"><svg viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg><span>${esc(j.hl)}</span></div>`:''}
      <div class="attach">
        ${j.cert?`
          <button class="cert-chip" onclick="openLb('${j.cert}','${esc(j.co)}')">
            <img src="${CERTS[j.cert]}" alt="">
            <div><div class="ct">📎 ${esc(t.cert_chip)}</div><div class="cs">${esc(t.cert_view)}</div></div>
          </button>
          <span class="verified"><svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5.5 3.4 10.7 8 12 4.6-1.3 8-6.5 8-12V5zm-1.4 14.5-3.5-3.5 1.4-1.4 2.1 2.1 4.9-4.9 1.4 1.4z"/></svg>${esc(t.vrf)}</span>
        `:`<span class="now"><span class="dot"></span><span>${esc(t.now_lbl)}</span></span>`}
      </div>
    </article>`).join('');

  document.getElementById('certs').innerHTML=t.certs.map(c=>`
    <li class="c-item"><span class="c-ck">✓</span><span>${esc(c.t)}</span>${c.id?`<span class="c-id">${esc(c.id)}</span>`:''}</li>`).join('');

  document.getElementById('skills').innerHTML=t.skills.map(g=>`
    <div class="skill-group">
      <h4>${esc(g.h)}</h4>
      <div class="tags">${g.tags.map(s=>`<span class="tag${g.tech?' t':''}">${esc(s)}</span>`).join('')}</div>
    </div>`).join('');

  counted=false;
  observe();
  const f=document.getElementById('facts');
  if(f.getBoundingClientRect().top<innerHeight){f.classList.add('show');runCounters();}
}

function openLb(k,name){
  document.getElementById('lbImg').src=CERTS[k];
  document.getElementById('lbName').textContent=name;
  document.getElementById('lb').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeLb(){document.getElementById('lb').classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb()});

window.addEventListener('scroll',()=>{
  document.getElementById('nav').classList.toggle('bg',scrollY>30);
  const h=document.documentElement.scrollHeight-innerHeight;
  document.getElementById('bar').style.width=(scrollY/h*100)+'%';
});

setLang('en');
</script>
</body>
</html>
