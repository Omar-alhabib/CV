<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عمر الحبيب — التقرير السنوي للمسيرة المهنية | Omar Alhabib</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0C1B33;
  --navy2:#122545;
  --blue:#1F5FC4;
  --blue2:#2E7BF6;
  --sky:#7FB0F5;
  --paper:#F8F6F0;
  --paper2:#FFFFFF;
  --ink:#1B2A44;
  --ink-soft:#46587A;
  --rule:#D8D2C2;
  --green:#0E8A4C;
  --gold:#B98A2F;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Cairo',sans-serif;color:var(--ink);
  background:var(--paper);line-height:1.8;font-size:15.5px;overflow-x:hidden;
}
.wrap{max-width:980px;margin:0 auto;padding:0 24px}
.amiri{font-family:'Cairo',sans-serif}

/* ================= COVER ================= */
.cover{
  min-height:100vh;position:relative;color:#EAF1FF;
  background:
    radial-gradient(800px 500px at 80% 10%,rgba(46,123,246,.22),transparent 60%),
    radial-gradient(600px 400px at 10% 90%,rgba(46,123,246,.12),transparent 60%),
    linear-gradient(160deg,#091527,var(--navy) 55%,#0E2140);
  display:flex;flex-direction:column;justify-content:center;
  overflow:hidden;
}
.cover::before{ /* fine guilloche-like rings, like banknotes */
  content:"";position:absolute;inset:-30%;
  background:repeating-radial-gradient(circle at 85% 15%,transparent 0 26px,rgba(127,176,245,.05) 26px 27px);
  pointer-events:none;
}
.cover-frame{ /* official document border */
  position:absolute;inset:18px;border:1px solid rgba(127,176,245,.25);
  pointer-events:none;
}
.cover-frame::before{content:"";position:absolute;inset:6px;border:1px solid rgba(127,176,245,.12)}
.cover-inner{position:relative;z-index:1;display:flex;align-items:center;gap:60px;padding:60px 0}
.seal-photo{position:relative;width:230px;height:230px;flex-shrink:0}
.seal-photo svg.ring{position:absolute;inset:-26px;width:calc(100% + 52px);height:calc(100% + 52px);animation:rot 30s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.seal-photo img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid rgba(234,241,255,.85);box-shadow:0 18px 60px rgba(0,0,0,.55)}
.fy{
  display:inline-flex;align-items:center;gap:12px;color:var(--sky);
  font-size:12.5px;font-weight:800;letter-spacing:.26em;text-transform:uppercase;margin-bottom:14px;
}
.fy::before,.fy::after{content:"";width:34px;height:1px;background:var(--sky);opacity:.6}
.cover h1{font-size:clamp(40px,6.5vw,72px);font-weight:900;line-height:1.1;color:#fff;margin-bottom:2px}
.cover .role{font-family:'Cairo',sans-serif;font-size:clamp(19px,3vw,27px);color:#AFC8F2;margin-bottom:22px}
.cover .tagline{max-width:560px;color:#C6D6F2;font-size:15.5px;margin-bottom:30px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:9px;font-family:'Cairo',sans-serif;
  font-weight:700;font-size:15px;padding:11px 26px;border-radius:6px;
  border:none;cursor:pointer;text-decoration:none;transition:.25s;
}
.btn svg{width:17px;height:17px;fill:currentColor}
.btn-solid{background:var(--blue2);color:#fff;box-shadow:0 10px 30px rgba(46,123,246,.4)}
.btn-solid:hover{transform:translateY(-2px)}
.btn-line{background:transparent;border:1.5px solid rgba(175,200,242,.5);color:#DCE8FB}
.btn-line:hover{border-color:#fff;background:rgba(255,255,255,.06)}
.phone{direction:ltr}

/* the audited stamp */
.stamp{
  position:absolute;top:14%;inset-inline-end:7%;z-index:2;
  width:170px;height:170px;border-radius:50%;
  border:3px dashed rgba(127,176,245,.85);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--sky);transform:rotate(12deg) scale(3);opacity:0;
  animation:slam .55s cubic-bezier(.2,1.4,.4,1) .9s forwards;
  background:rgba(46,123,246,.06);backdrop-filter:blur(2px);
}
@keyframes slam{to{transform:rotate(-9deg) scale(1);opacity:1}}
.stamp .big{font-size:21px;font-weight:900;letter-spacing:.12em}
.stamp .sm{font-size:11px;font-weight:700;letter-spacing:.2em;opacity:.85}
.stamp .chk{font-size:25px}
.open-report{
  position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
  color:#8FA9D6;font-size:13px;font-weight:700;text-align:center;z-index:2;
}
.open-report span{display:block;font-size:21px;animation:dip 1.8s ease infinite}
@keyframes dip{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}

/* ================= PAPER DOC ================= */
.doc{background:var(--paper);position:relative}
.doc::before{ /* binding edge */
  content:"";position:absolute;top:0;bottom:0;inset-inline-start:0;width:7px;
  background:repeating-linear-gradient(180deg,var(--blue) 0 26px,var(--gold) 26px 30px);
  opacity:.85;
}
.letterhead{
  border-bottom:2.5px solid var(--navy);padding:30px 0 16px;margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;
}
.letterhead .lh-title{font-family:'Cairo',sans-serif;font-size:clamp(20px,3.4vw,29px);font-weight:700;color:var(--navy)}
.letterhead .lh-sub{color:var(--ink-soft);font-size:13px}
.letterhead .lh-meta{font-size:12.5px;color:var(--ink-soft);text-align:end;direction:ltr}

/* section titling like statement headers */
section{padding:42px 0 6px}
h2{
  font-family:'Cairo',sans-serif;font-size:clamp(21px,3vw,26px);font-weight:700;color:var(--navy);
  display:flex;align-items:baseline;gap:14px;margin-bottom:8px;
}
h2 .no{
  font-family:'Cairo',sans-serif;font-size:12px;font-weight:800;color:var(--blue);
  border:1.5px solid var(--blue);border-radius:4px;padding:0 9px;letter-spacing:.05em;
  white-space:nowrap;transform:translateY(-3px);
}
.rule-line{height:1px;background:var(--rule);margin-bottom:26px;position:relative}
.rule-line::after{content:"";position:absolute;inset-inline-start:0;top:-1px;width:90px;height:3px;background:var(--blue)}

/* auditor opinion */
.opinion{
  background:var(--paper2);border:1px solid var(--rule);border-radius:4px;
  padding:28px 32px;position:relative;box-shadow:0 2px 14px rgba(27,42,68,.05);
}
.opinion::before{content:"";position:absolute;top:0;inset-inline:0;height:4px;background:linear-gradient(90deg,var(--blue),var(--sky))}
.opinion p{color:var(--ink-soft);font-size:15.5px;max-width:820px}
.opinion .verdict{
  display:inline-flex;align-items:center;gap:8px;margin-top:14px;
  background:rgba(14,138,76,.08);border:1px solid rgba(14,138,76,.35);color:var(--green);
  font-size:13px;font-weight:800;border-radius:99px;padding:4px 16px;
}

/* key indicators */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--paper2)}
.kpi{
  padding:24px 16px;text-align:center;border-inline-end:1px dashed var(--rule);position:relative;
}
.kpi:last-child{border-inline-end:none}
.kpi .num{
  font-size:clamp(28px,4vw,40px);font-weight:900;color:var(--blue);line-height:1.2;direction:ltr;
}
.kpi .lbl{font-size:13px;color:var(--ink-soft);font-weight:600}
.kpi::after{content:"✓";position:absolute;top:8px;inset-inline-end:10px;color:var(--green);font-size:12px;font-weight:900;opacity:.7}

/* ============ experience as audited entries ============ */
.entry{
  background:var(--paper2);border:1px solid var(--rule);border-radius:4px;
  margin-bottom:22px;overflow:hidden;box-shadow:0 2px 14px rgba(27,42,68,.05);
  position:relative;
}
.entry-head{
  display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  padding:18px 26px;border-bottom:1px solid var(--rule);
  background:linear-gradient(180deg,#FCFBF7,#F6F4ED);
}
.entry-head .note-ref{
  font-size:11px;font-weight:800;color:var(--blue);letter-spacing:.08em;
  border:1.5px dashed var(--blue);border-radius:4px;padding:1px 10px;white-space:nowrap;
}
.entry-head h3{font-size:18.5px;font-weight:800;color:var(--navy)}
.entry-head .co{color:var(--blue);font-size:14px;font-weight:700}
.dates{
  font-size:12.5px;font-weight:800;color:var(--green);direction:ltr;white-space:nowrap;
  background:rgba(14,138,76,.07);border:1px solid rgba(14,138,76,.3);border-radius:99px;padding:2px 14px;
}
.entry-body{padding:22px 26px}
.entry ul{list-style:none}
.entry li{
  position:relative;padding-inline-start:24px;margin-bottom:7px;
  color:var(--ink-soft);font-size:14.5px;
}
.entry li::before{
  content:"";position:absolute;inset-inline-start:4px;top:12px;
  width:7px;height:7px;border:1.5px solid var(--blue);border-radius:2px;background:rgba(46,123,246,.1);
}
.impact{
  margin-top:16px;background:rgba(46,123,246,.06);border:1px solid rgba(46,123,246,.3);
  border-inline-start:4px solid var(--blue);
  border-radius:4px;padding:13px 18px;font-size:14px;color:var(--ink);
  display:flex;gap:12px;align-items:flex-start;
}
.impact svg{width:18px;height:18px;fill:var(--blue);flex-shrink:0;margin-top:5px}

/* attached certificate chip */
.attach{
  margin-top:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  border-top:1px dashed var(--rule);padding-top:16px;
}
.attach-chip{
  display:inline-flex;align-items:center;gap:12px;cursor:pointer;border:none;
  background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;
  padding:9px 16px 9px 10px;font-family:'Cairo',sans-serif;transition:.25s;text-align:start;
}
.attach-chip:hover{border-color:var(--blue);box-shadow:0 6px 20px rgba(31,95,196,.15);transform:translateY(-2px)}
.attach-chip img{
  width:46px;height:60px;object-fit:cover;object-position:top;
  border:1px solid var(--rule);border-radius:3px;background:#fff;
}
.attach-chip .at{font-size:13.5px;font-weight:800;color:var(--navy);line-height:1.45}
.attach-chip .as{font-size:11.5px;color:var(--blue);font-weight:700;display:flex;align-items:center;gap:5px}
.attach-chip .as svg{width:12px;height:12px;fill:var(--blue)}
.verified{
  display:inline-flex;align-items:center;gap:7px;color:var(--green);
  font-size:12px;font-weight:800;
}
.verified .vd{
  width:20px;height:20px;border-radius:50%;background:rgba(14,138,76,.1);
  border:1.5px solid var(--green);display:flex;align-items:center;justify-content:center;font-size:11px;
}
.running{
  display:inline-flex;align-items:center;gap:8px;color:var(--blue);font-size:12.5px;font-weight:800;
}
.running .pulse{
  width:9px;height:9px;border-radius:50%;background:var(--blue2);
  box-shadow:0 0 0 0 rgba(46,123,246,.5);animation:pp 1.8s ease infinite;
}
@keyframes pp{70%{box-shadow:0 0 0 9px rgba(46,123,246,0)}100%{box-shadow:0 0 0 0 rgba(46,123,246,0)}}

/* ============ notes: certs & skills ============ */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.note-card{background:var(--paper2);border:1px solid var(--rule);border-radius:4px;padding:24px 26px}
.clist{list-style:none}
.clist li{
  display:flex;align-items:center;gap:12px;padding:10px 0;
  border-bottom:1px dashed var(--rule);font-size:14.5px;color:var(--ink);font-weight:600;
}
.clist li:last-child{border-bottom:none}
.clist .vd{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  background:rgba(31,95,196,.08);border:1.5px solid var(--blue);color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;
}
.clist .id{
  margin-inline-start:auto;font-size:11px;color:#fff;background:var(--green);
  font-weight:800;border-radius:4px;padding:0 9px;direction:ltr;white-space:nowrap;
}
.skill-block{margin-bottom:16px}
.skill-block h4{font-size:13px;color:var(--ink-soft);font-weight:800;letter-spacing:.06em;margin-bottom:9px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{
  font-size:13px;font-weight:700;color:var(--blue);background:rgba(31,95,196,.06);
  border:1px solid rgba(31,95,196,.35);padding:4px 14px;border-radius:4px;
}
.tag.soft{color:var(--ink-soft);background:transparent;border-color:var(--rule)}

/* education + total */
.edu{
  background:var(--paper2);border:1px solid var(--rule);border-radius:4px;
  padding:22px 26px;display:flex;align-items:center;gap:18px;
}
.edu .cap{
  width:48px;height:48px;border-radius:4px;flex-shrink:0;
  background:rgba(31,95,196,.08);border:1.5px solid var(--blue);
  display:flex;align-items:center;justify-content:center;
}
.edu .cap svg{width:26px;height:26px;fill:var(--blue)}
.edu h3{font-size:16.5px;font-weight:800;color:var(--navy)}
.edu p{color:var(--ink-soft);font-size:14px}
.edu .yr{margin-inline-start:auto;color:var(--green);font-weight:800;font-size:13.5px;direction:ltr;white-space:nowrap}

/* the accountant's double rule total */
.total-row{
  margin-top:34px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  font-family:'Cairo',sans-serif;font-size:clamp(17px,2.6vw,21px);font-weight:700;color:var(--navy);
  border-top:1.5px solid var(--navy);padding-top:12px;position:relative;
}
.total-row::before{content:"";position:absolute;top:3px;left:0;right:0;height:1.5px;background:var(--navy)}
.total-row .val{direction:ltr;color:var(--blue);border-bottom:3.5px double var(--navy);padding:0 6px}

/* signature & contact */
.sign-band{
  margin-top:50px;background:var(--navy);color:#DCE8FB;
  padding:48px 0 56px;text-align:center;position:relative;overflow:hidden;
}
.sign-band::before{
  content:"";position:absolute;inset:14px;border:1px solid rgba(127,176,245,.2);pointer-events:none;
}
.sign-band h2{color:#fff;justify-content:center}
.sign-band p{color:#A9BEE4;max-width:520px;margin:0 auto 26px;font-size:14.5px}
.contact-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;position:relative;z-index:1}
footer{padding:18px 0 30px;color:#8A8273;font-size:12px;text-align:center;background:var(--paper)}

/* ============ certificate lightbox ============ */
#lightbox{
  position:fixed;inset:0;background:rgba(9,17,33,.88);z-index:120;
  display:none;align-items:center;justify-content:center;padding:30px 16px;backdrop-filter:blur(4px);
}
#lightbox.open{display:flex}
.lb-inner{max-width:660px;width:100%;max-height:92vh;display:flex;flex-direction:column;animation:lbIn .3s ease}
@keyframes lbIn{from{transform:scale(.93);opacity:0}to{transform:scale(1);opacity:1}}
.lb-bar{
  background:var(--navy2);color:#fff;border-radius:8px 8px 0 0;
  padding:12px 18px;display:flex;align-items:center;gap:12px;
}
.lb-bar .t{font-size:14px;font-weight:800;flex:1}
.lb-bar .verified{color:#7BE3AC}
.lb-bar .verified .vd{border-color:#7BE3AC;background:rgba(123,227,172,.1)}
.lb-close{
  background:rgba(255,255,255,.12);border:none;color:#fff;width:30px;height:30px;
  border-radius:50%;cursor:pointer;font-size:15px;
}
.lb-img{overflow:auto;background:#fff;border-radius:0 0 8px 8px;text-align:center}
.lb-img img{width:100%;display:block}

/* reveal */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease, transform .7s ease}
.reveal.show{opacity:1;transform:none}

/* nav minimal */
nav{position:fixed;top:0;left:0;right:0;z-index:60;padding:12px 0;transition:.3s}
nav.solid{background:rgba(248,246,240,.95);box-shadow:0 1px 0 var(--rule)}
nav .nav-inner{max-width:980px;margin:0 auto;padding:0 24px;display:flex;justify-content:space-between;align-items:center}
nav .brand{font-family:'Cairo',sans-serif;font-weight:700;font-size:17px;color:#fff;transition:.3s}
nav.solid .brand{color:var(--navy)}
.lang-btn{
  background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.4);color:#fff;
  font-family:'Cairo',sans-serif;font-size:13px;font-weight:800;padding:5px 18px;border-radius:99px;cursor:pointer;transition:.25s;
}
nav.solid .lang-btn{border-color:var(--blue);color:var(--blue);background:rgba(31,95,196,.06)}
.lang-btn:hover{transform:translateY(-1px)}

@media(max-width:840px){
  .cover-inner{flex-direction:column;text-align:center;gap:30px;padding:90px 0 70px}
  .btns{justify-content:center}
  .cover .tagline{margin-inline:auto}
  .seal-photo{width:170px;height:170px}
  .stamp{width:128px;height:128px;top:auto;bottom:11%;inset-inline-end:6%}
  .stamp .big{font-size:16px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi:nth-child(2){border-inline-end:none}
  .kpi:nth-child(-n+2){border-bottom:1px dashed var(--rule)}
  .grid2{grid-template-columns:1fr}
  .entry-head{flex-direction:column;align-items:flex-start;gap:6px}
  .letterhead{flex-direction:column;align-items:flex-start}
  .letterhead .lh-meta{text-align:start}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
  .stamp{opacity:1;transform:rotate(-9deg) scale(1)}
}
</style>
</head>
<body>

<nav id="nav">
  <div class="nav-inner">
    <div class="brand" data-i="brand"></div>
    <button class="lang-btn" id="langBtn" onclick="toggleLang()">العربية</button>
  </div>
</nav>

<!-- ============ COVER ============ -->
<header class="cover">
  <div class="cover-frame"></div>
  <div class="stamp">
    <span class="chk">✓</span>
    <span class="big" data-i="stamp1"></span>
    <span class="sm" data-i="stamp2"></span>
  </div>
  <div class="wrap cover-inner">
    <div class="seal-photo">
      <svg class="ring" viewBox="0 0 200 200">
        <defs><path id="circ" d="M100,100 m-84,0 a84,84 0 1,1 168,0 a84,84 0 1,1 -168,0"/></defs>
        <text fill="rgba(127,176,245,.55)" font-size="11.5" font-weight="700" letter-spacing="3.5">
          <textPath href="#circ">SENIOR ACCOUNTANT • SOCPA ASSOCIATE • ERP PROFESSIONAL • EST. 2020 •</textPath>

let LANG = 'ar';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function toggleLang(){ setLang(LANG === 'ar' ? 'en' : 'ar'); }

/* counters */
let counted = false;
function runCounters(){
  if(counted) return; counted = true;
  document.querySelectorAll('.kpi .num').forEach(el=>{
    const target = +el.dataset.count, suf = el.dataset.suffix || '';
    if(reduceMotion){ el.textContent = target + suf; return; }
    const dur = 1300, t0 = performance.now();
    (function step(t){
      const p = Math.min((t - t0)/dur, 1);
      el.textContent = Math.round(target * (1-Math.pow(1-p,3))) + (p===1 ? suf : '');
      if(p < 1) requestAnimationFrame(step);
    })(t0);
  });
}

let io;
function observeReveals(){
  if(io) io.disconnect();
  io = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        e.target.classList.add('show');
        if(e.target.id === 'kpis') runCounters();
        io.unobserve(e.target);
      }
    });
  },{threshold:.15});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
}

function setLang(l){
  LANG = l;
  const t = T[l];
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('langBtn').textContent = l === 'ar' ? 'English' : 'العربية';
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t[el.dataset.i]; });

  document.getElementById('jobs').innerHTML = t.jobs.map((j,i) => `
    <article class="entry reveal" style="transition-delay:${i*0.07}s">
      <div class="entry-head">
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
          <span class="note-ref">${esc(t['n3'])}.${i+1}</span>
          <div>
            <h3>${esc(j.title)}</h3>
            <div class="co">${esc(j.co)}</div>
          </div>
        </div>
        <span class="dates">${esc(j.dates)}</span>
      </div>
      <div class="entry-body">
        <ul>${j.pts.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
        ${j.hl ? `<div class="impact"><svg viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg><span>${esc(j.hl)}</span></div>` : ''}
        <div class="attach">
          ${j.cert ? `
            <button class="attach-chip" onclick="openLb('${j.cert}','${esc(j.co)}')">
              <img src="${CERTS[j.cert]}" alt="certificate thumbnail">
              <span>
                <span class="at">📎 ${esc(t.attach_t)}</span>
                <span class="as"><svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.7 7.6 1 12c1.7 4.4 6 7.5 11 7.5s9.3-3.1 11-7.5c-1.7-4.4-6-7.5-11-7.5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>${esc(t.attach_s)}</span>
              </span>
            </button>
            <span class="verified"><span class="vd">✓</span>${esc(t.vrf)}</span>`
          : `<span class="running"><span class="pulse"></span>${esc(t.now)}</span>`}
        </div>
      </div>
    </article>`).join('');

  document.getElementById('certs').innerHTML = t.certs.map(c => `
    <li><span class="vd">✓</span><span>${esc(c.t)}</span>${c.id ? `<span class="id">${esc(c.id)}</span>` : ''}</li>`).join('');

  document.getElementById('skills').innerHTML = t.skills.map(g => `
    <div class="skill-block">
      <h4>${esc(g.h)}</h4>
      <div class="tags">${g.tags.map(s=>`<span class="tag${g.erp?'':' soft'}">${esc(s)}</span>`).join('')}</div>
    </div>`).join('');

  counted = false;
  observeReveals();
  const k = document.getElementById('kpis');
  if(k.getBoundingClientRect().top < innerHeight){ k.classList.add('show'); runCounters(); }
}

/* lightbox */
function openLb(key, title){
  document.getElementById('lbImg').src = CERTS[key];
  document.getElementById('lbTitle').textContent = title;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLb(){
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeLb(); });

window.addEventListener('scroll', () => {
  document.getElementById('nav').classList.toggle('solid', scrollY > innerHeight * .6);
});
