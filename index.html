<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عمر الحبيب — محاسب أول | Omar Alhabib — Senior Accountant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2E7BF6;
  --blue2:#5EA0FF;
  --cyan:#38D6E8;
  --bg:#0A0F1E;
  --bg2:#0F1730;
  --card:rgba(255,255,255,.045);
  --line:rgba(120,160,255,.14);
  --text:#F2F6FF;
  --muted:#9FB0CE;
  --dim:#6B7A99;
  --green:#3DDC84;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Cairo',sans-serif;
  background:var(--bg);color:var(--text);
  line-height:1.75;font-size:15.5px;overflow-x:hidden;
}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}

/* ===== animated background ===== */
.bg-fx{position:fixed;inset:0;z-index:-2;overflow:hidden;
  background:
    radial-gradient(900px 600px at 85% -10%,rgba(46,123,246,.18),transparent 60%),
    radial-gradient(700px 500px at 0% 40%,rgba(56,214,232,.07),transparent 60%),
    radial-gradient(800px 600px at 70% 110%,rgba(46,123,246,.10),transparent 60%),
    var(--bg);
}
.bg-fx::after{ /* ledger grid */
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(120,160,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(120,160,255,.05) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 0%,transparent 75%);
}
.float-sym{
  position:fixed;z-index:-1;color:rgba(94,160,255,.10);
  font-weight:900;user-select:none;pointer-events:none;
  animation:drift linear infinite;
}
@keyframes drift{
  0%{transform:translateY(15vh) rotate(0deg)}
  100%{transform:translateY(-115vh) rotate(20deg)}
}

/* ===== scroll progress ===== */
#progress{
  position:fixed;top:0;left:0;height:3px;width:0%;z-index:99;
  background:linear-gradient(90deg,var(--blue),var(--cyan));
  box-shadow:0 0 12px rgba(46,123,246,.8);
}

/* ===== nav ===== */
nav{position:fixed;top:3px;left:0;right:0;z-index:50;transition:.3s}
nav.solid{background:rgba(10,15,30,.92);backdrop-filter:blur(12px);box-shadow:0 1px 0 var(--line)}
.nav-inner{max-width:1100px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.nav-name{font-weight:800;font-size:17px;display:flex;align-items:center;gap:9px}
.nav-name .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 12px var(--blue)}
.lang-btn{
  background:rgba(46,123,246,.12);border:1px solid rgba(46,123,246,.45);color:#CFE0FB;
  font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;
  padding:6px 20px;border-radius:99px;cursor:pointer;transition:.2s;
}
.lang-btn:hover{background:rgba(46,123,246,.3);color:#fff}
.lang-btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ===== hero ===== */
.hero{min-height:96vh;display:flex;align-items:center;padding:120px 0 60px;position:relative}
.hero-inner{display:flex;align-items:center;gap:56px;width:100%}
.photo-ring{position:relative;flex-shrink:0;width:216px;height:216px}
.photo-ring::before{
  content:"";position:absolute;inset:-9px;border-radius:50%;
  background:conic-gradient(var(--blue),var(--cyan),transparent 40%,var(--blue));
  animation:spin 7s linear infinite;
}
.photo-ring::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
.photo{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.eyebrow{
  display:inline-flex;align-items:center;gap:10px;
  color:var(--blue2);font-size:12.5px;font-weight:800;letter-spacing:.24em;
  text-transform:uppercase;margin-bottom:10px;
}
.eyebrow::before{content:"";width:30px;height:2px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
h1{
  font-size:clamp(38px,6vw,64px);font-weight:900;line-height:1.12;margin-bottom:4px;
  background:linear-gradient(120deg,#fff 30%,var(--blue2) 70%,var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.role-line{font-size:clamp(17px,2.5vw,23px);font-weight:700;color:var(--muted);margin-bottom:18px;min-height:1.7em}
.role-line .typed{color:var(--cyan)}
.role-line .caret{display:inline-block;width:2px;height:1.05em;background:var(--cyan);vertical-align:-3px;margin:0 3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero p{max-width:620px;color:#C6D2E8;font-size:16px;margin-bottom:26px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:9px;
  font-family:'Cairo',sans-serif;font-weight:700;font-size:15px;
  padding:11px 26px;border-radius:99px;border:none;cursor:pointer;
  text-decoration:none;transition:.25s;
}
.btn svg{width:17px;height:17px;fill:currentColor;flex-shrink:0}
.btn-blue{
  background:linear-gradient(120deg,var(--blue),#1F63D6);color:#fff;
  box-shadow:0 8px 28px rgba(46,123,246,.4);
}
.btn-blue:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(46,123,246,.55)}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#E3ECFF}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.phone{direction:ltr}
.scroll-cue{
  position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
  color:var(--dim);font-size:22px;animation:bounce 1.8s ease infinite;
}
@keyframes bounce{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,9px)}}

/* ===== stat counters ===== */
.stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:16px;
  margin-top:-10px;padding-bottom:10px;
}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:22px 18px;text-align:center;backdrop-filter:blur(8px);
  position:relative;overflow:hidden;transition:.3s;
}
.stat:hover{transform:translateY(-4px);border-color:rgba(46,123,246,.5)}
.stat::before{
  content:"";position:absolute;top:0;inset-inline:0;height:2.5px;
  background:linear-gradient(90deg,transparent,var(--blue),transparent);
}
.stat .num{
  font-size:clamp(28px,4vw,42px);font-weight:900;line-height:1.15;
  background:linear-gradient(120deg,var(--blue2),var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  direction:ltr;
}
.stat .lbl{color:var(--muted);font-size:13.5px;font-weight:600;margin-top:2px}

/* ===== sections ===== */
section{padding:64px 0 6px}
h2{
  font-size:clamp(22px,3vw,28px);font-weight:900;margin-bottom:34px;
  display:flex;align-items:center;gap:16px;
}
h2 .glyph{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,rgba(46,123,246,.25),rgba(56,214,232,.12));
  border:1px solid rgba(46,123,246,.4);
  display:flex;align-items:center;justify-content:center;
}
h2 .glyph svg{width:22px;height:22px;fill:var(--blue2)}
h2 small{font-size:13px;color:var(--dim);font-weight:600;margin-inline-start:auto}

/* ===== timeline experience ===== */
.timeline{position:relative;padding-inline-start:34px}
.timeline::before{
  content:"";position:absolute;inset-inline-start:10px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(180deg,var(--blue),rgba(46,123,246,.06));
}
.job{
  position:relative;margin-bottom:26px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:26px 30px;backdrop-filter:blur(8px);
  transition:border-color .3s, transform .3s, box-shadow .3s;
}
.job:hover{border-color:rgba(46,123,246,.55);transform:translateY(-3px);box-shadow:0 16px 44px rgba(0,0,0,.45)}
.job::before{
  content:"";position:absolute;inset-inline-start:-31px;top:32px;
  width:14px;height:14px;border-radius:50%;background:var(--bg);
  border:3px solid var(--blue);box-shadow:0 0 0 4px rgba(46,123,246,.18);
}
.job.current::before{background:var(--blue);box-shadow:0 0 0 5px rgba(46,123,246,.25),0 0 18px var(--blue);animation:pulse 2.2s ease infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(46,123,246,.10),0 0 22px var(--blue)}}
.job.current{border-color:rgba(46,123,246,.5)}
.now-badge{
  position:absolute;top:-12px;inset-inline-start:22px;
  background:linear-gradient(120deg,var(--blue),var(--cyan));color:#06122B;
  font-size:11.5px;font-weight:900;padding:2px 14px;border-radius:99px;letter-spacing:.03em;
}
.job-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.job h3{font-size:19.5px;font-weight:800}
.job .co{color:var(--blue2);font-size:14.5px;font-weight:700}
.dates{
  color:var(--green);font-size:13px;font-weight:700;direction:ltr;
  background:rgba(61,220,132,.08);border:1px solid rgba(61,220,132,.3);
  padding:3px 14px;border-radius:99px;white-space:nowrap;
}
.job ul{list-style:none}
.job li{
  position:relative;padding-inline-start:22px;margin-bottom:7px;
  color:#C9D5EC;font-size:14.5px;
}
.job li::before{
  content:"▸";position:absolute;inset-inline-start:0;color:var(--cyan);
  font-size:13px;top:1px;
}
html[dir="rtl"] .job li::before{content:"◂"}
.impact{
  margin-top:16px;display:flex;gap:12px;align-items:flex-start;
  background:linear-gradient(120deg,rgba(46,123,246,.14),rgba(56,214,232,.06));
  border:1px solid rgba(46,123,246,.4);
  border-radius:12px;padding:14px 18px;font-size:14px;color:#DCE9FF;
}
.impact svg{width:19px;height:19px;fill:var(--cyan);flex-shrink:0;margin-top:4px}

/* ===== certs ===== */
.cert-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cert{
  position:relative;overflow:hidden;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:20px;transition:.3s;backdrop-filter:blur(8px);
}
.cert:hover{transform:translateY(-4px);border-color:rgba(46,123,246,.55)}
.cert::after{ /* shine sweep */
  content:"";position:absolute;top:0;inset-inline-start:-80%;width:50%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.10),transparent);
  transform:skewX(-18deg);transition:inset-inline-start .55s ease;
}
.cert:hover::after{inset-inline-start:130%}
.cert .ico{
  width:40px;height:40px;border-radius:10px;margin-bottom:12px;
  background:rgba(46,123,246,.16);border:1px solid rgba(46,123,246,.35);
  display:flex;align-items:center;justify-content:center;
}
.cert .ico svg{width:20px;height:20px;fill:var(--blue2)}
.cert h3{font-size:14.5px;font-weight:700;line-height:1.5}
.cert .id{
  display:inline-block;margin-top:8px;font-size:11.5px;color:#06122B;
  background:var(--green);font-weight:800;border-radius:5px;padding:0 9px;direction:ltr;
}

/* ===== skills ===== */
.skills-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:start}
.bar-row{margin-bottom:16px}
.bar-top{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:6px}
.bar-top .pct{color:var(--cyan);direction:ltr}
.bar{height:9px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
.bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--blue),var(--cyan));
  box-shadow:0 0 14px rgba(46,123,246,.6);
  transition:width 1.2s cubic-bezier(.2,.8,.2,1);
}
.skill-block{margin-bottom:22px}
.skill-block h3{font-size:13.5px;color:var(--dim);font-weight:800;letter-spacing:.08em;margin-bottom:10px;text-transform:uppercase}
.tags{display:flex;flex-wrap:wrap;gap:9px}
.tag{
  font-size:13.5px;font-weight:600;color:#DDE7FA;background:rgba(255,255,255,.05);
  border:1px solid var(--line);padding:6px 16px;border-radius:99px;transition:.25s;
}
.tag:hover{border-color:var(--blue);background:rgba(46,123,246,.14);transform:translateY(-2px)}

/* ===== education ===== */
.edu{
  background:linear-gradient(120deg,rgba(46,123,246,.12),rgba(255,255,255,.03));
  border:1px solid rgba(46,123,246,.35);border-radius:16px;
  padding:26px 30px;display:flex;align-items:center;gap:20px;max-width:640px;
}
.edu .cap{
  width:54px;height:54px;border-radius:14px;flex-shrink:0;
  background:rgba(46,123,246,.18);border:1px solid rgba(46,123,246,.4);
  display:flex;align-items:center;justify-content:center;
}
.edu .cap svg{width:28px;height:28px;fill:var(--blue2)}
.edu h3{font-size:17px;font-weight:800}
.edu p{color:var(--muted);font-size:14px}
.edu .yr{margin-inline-start:auto;color:var(--green);font-weight:800;font-size:14px;direction:ltr;white-space:nowrap}

/* ===== contact ===== */
.contact{
  margin:70px 0 0;text-align:center;padding:60px 0 70px;position:relative;
  background:
    radial-gradient(600px 280px at 50% 0%,rgba(46,123,246,.18),transparent 70%);
  border-top:1px solid var(--line);
}
.contact h2{justify-content:center}
.contact p{color:var(--muted);max-width:520px;margin:-16px auto 26px}
.contact-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

footer{padding:20px 0 34px;color:var(--dim);font-size:12.5px;text-align:center}

/* ===== reveal on scroll ===== */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease, transform .7s ease}
.reveal.show{opacity:1;transform:none}

@media(max-width:860px){
  .hero{min-height:auto;padding:110px 0 50px}
  .hero-inner{flex-direction:column;text-align:center;gap:30px}
  .btns{justify-content:center}
  .hero p{margin-inline:auto}
  .photo-ring{width:160px;height:160px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .cert-grid{grid-template-columns:1fr 1fr}
  .skills-grid{grid-template-columns:1fr;gap:26px}
  .job{padding:22px 20px}
  .job-head{flex-direction:column;gap:6px}
}
@media(max-width:520px){.cert-grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
  .bar i{transition:none}
}
</style>
</head>

let LANG = 'ar';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function toggleLang(){ setLang(LANG === 'ar' ? 'en' : 'ar'); }

/* floating accounting symbols */
(function(){
  if(reduceMotion) return;
  const syms = ['%','Σ','✓','＋','＝','₪'.replace('₪','﷼')];
  for(let i=0;i<10;i++){
    const s = document.createElement('div');
    s.className = 'float-sym';
    s.textContent = syms[i % syms.length];
    s.style.left = (Math.random()*96)+'%';
    s.style.top = (60+Math.random()*40)+'vh';
    s.style.fontSize = (16+Math.random()*30)+'px';
    s.style.animationDuration = (26+Math.random()*30)+'s';
    s.style.animationDelay = (-Math.random()*30)+'s';
    document.body.appendChild(s);
  }
})();

/* typewriter */
let typeTimer;
function startTyping(){
  clearTimeout(typeTimer);
  const el = document.getElementById('typed');
  const words = T[LANG].typed;
  let w=0, c=0, del=false;
  (function tick(){
    const word = words[w];
    if(reduceMotion){ el.textContent = words[0]; return; }
    el.textContent = word.slice(0, c);
    if(!del && c < word.length){ c++; typeTimer=setTimeout(tick, 70); }
    else if(!del){ del=true; typeTimer=setTimeout(tick, 1700); }
    else if(c > 0){ c--; typeTimer=setTimeout(tick, 35); }
    else { del=false; w=(w+1)%words.length; typeTimer=setTimeout(tick, 350); }
  })();
}

/* counters */
let counted = false;
function runCounters(){
  if(counted) return; counted = true;
  document.querySelectorAll('.stat .num').forEach(el=>{
    const target = +el.dataset.count, suf = el.dataset.suffix || '';
    if(reduceMotion){ el.textContent = target + suf; return; }
    const dur = 1400, t0 = performance.now();
    (function step(t){
      const p = Math.min((t - t0)/dur, 1);
      el.textContent = Math.round(target * (1-Math.pow(1-p,3))) + (p===1 ? suf : '');
      if(p < 1) requestAnimationFrame(step);
    })(t0);
  });
}

/* reveal observer */
let io;
function observeReveals(){
  if(io) io.disconnect();
  io = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        e.target.classList.add('show');
        if(e.target.id === 'stats') runCounters();
        if(e.target.id === 'bars') e.target.querySelectorAll('.bar i').forEach(b=>{ b.style.width = b.dataset.w + '%'; });
        io.unobserve(e.target);
      }
    });
  },{threshold:.18});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
}

function setLang(l){
  LANG = l;
  const t = T[l];
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('langBtn').textContent = l === 'ar' ? 'English' : 'العربية';
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t[el.dataset.i]; });

  document.getElementById('jobs').innerHTML = t.jobs.map((j,i) => `
    <article class="job reveal${j.current ? ' current' : ''}" style="transition-delay:${i*0.08}s">
      ${j.current ? `<span class="now-badge">${esc(t.now)}</span>` : ''}
      <div class="job-head">
        <div>
          <h3>${esc(j.title)}</h3>
          <div class="co">${esc(j.co)}</div>
        </div>
        <span class="dates">${esc(j.dates)}</span>
      </div>
      <ul>${j.pts.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
      ${j.hl ? `<div class="impact"><svg viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg><span>${esc(j.hl)}</span></div>` : ''}
    </article>`).join('');

  document.getElementById('certs').innerHTML = t.certs.map((c,i) => `
    <div class="cert reveal" style="transition-delay:${i*0.06}s">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5.5 3.4 10.7 8 12 4.6-1.3 8-6.5 8-12V5zm-1.4 14.5-3.5-3.5 1.4-1.4 2.1 2.1 4.9-4.9 1.4 1.4z"/></svg></div>
      <h3>${esc(c.t)}</h3>
      ${c.id ? `<span class="id">${esc(c.id)}</span>` : ''}
    </div>`).join('');

  document.getElementById('bars').innerHTML = t.bars.map(b => `
    <div class="bar-row">
      <div class="bar-top"><span>${esc(b.n)}</span><span class="pct">${b.v}%</span></div>
      <div class="bar"><i data-w="${b.v}"></i></div>
    </div>`).join('');

  document.getElementById('skill-tags').innerHTML = t.skills.map(g => `
    <div class="skill-block">
      <h3>${esc(g.h)}</h3>
      <div class="tags">${g.tags.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div>
    </div>`).join('');

  counted = false;
  startTyping();
  observeReveals();
  // re-show stats instantly if already in view after lang switch
  const statsEl = document.getElementById('stats');
  if(statsEl.getBoundingClientRect().top < innerHeight){ statsEl.classList.add('show'); runCounters(); }
}

/* nav + progress */
window.addEventListener('scroll', () => {
  document.getElementById('nav').classList.toggle('solid', scrollY > 30);
  const h = document.documentElement.scrollHeight - innerHeight;
  document.getElementById('progress').style.width = (scrollY / h * 100) + '%';
});

setLang('ar');
</script>
